name: Validate paired mobile sources
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: '0.13.7'
          enable-cache: true
      - run: uv sync --locked
      - name: Check Python quality
        run: |
          uv run --locked ruff check
          uv run --locked ruff format --check
          uv run --locked ty check
      - run: sudo apt-get update && sudo apt-get install -y lua5.1 luajit
      - run: uv run --locked python -m unittest discover -s tests -v
      - run: uv run --locked python scripts/mobile.py build
      - uses: actions/upload-artifact@v7
        with:
          name: patched-mobile-sources
          path: dist/
          if-no-files-found: error
