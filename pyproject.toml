[project]
name = "balatro-multiplayer-mobile"
version = "0.1.0"
description = "Paired official-release mobile patch and source release tooling"
requires-python = ">=3.15"
dependencies = []

[dependency-groups]
dev = ["ruff>=0.14", "ty>=0.0.1"]

[tool.uv]
package = false

[tool.ruff]
target-version = "py315"
include = ["scripts/**/*.py", "tests/**/*.py", "pyproject.toml"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP"]

[tool.ty.environment]
python-version = "3.15"
extra-paths = ["scripts"]

[tool.ty.src]
include = ["scripts", "tests"]
